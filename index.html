<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Mode Particles</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020617;
      cursor: none; /* Hide default cursor */
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    /* Custom Cursor */
    #custom-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 20px; height: 20px;
      background-color: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s ease-out;
    }
    /* Stunned Cursor State */
    body.stunned #custom-cursor {
      background-color: gold;
      box-shadow: 0 0 30px gold, 0 0 60px red;
    }
    /* Instructions UI */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
      transition: opacity 1s;
    }
    body.angry #ui { opacity: 0; }
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="custom-cursor"></div>
  <div id="ui">
    <h2>Phase 1: Calm</h2>
    <p>Disturb the swirling particles by shaking your mouse near the center...</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // --- State & Config ---
    const sizes = { width: window.innerWidth, height: window.innerHeight };
    
    // Mouse Management (Real vs Game logic to handle freezing)
    let mouse = { 
      realX: sizes.width / 2, realY: sizes.height / 2, 
      activeX: sizes.width / 2, activeY: sizes.height / 2 
    };
    let fboMouse = new THREE.Vector3(mouse.activeX, sizes.height - mouse.activeY, 0);
    
    // Story State
    let state = {
      isAngry: false,
      angerLevel: 0.0, // 0.0 = Calm Green, 1.0 = Angry Red Robot
      disturbance: 0,  // Builds up as user moves mouse near center
      stunTimer: 0,
      bombActive: false
    };

    // --- DOM Elements ---
    const cursorEl = document.getElementById('custom-cursor');

    // --- Three.js Scene Setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(0, sizes.width, sizes.height, 0, -1000, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(sizes.width, sizes.height);
    document.body.appendChild(renderer.domElement);

    // --- Post Processing (Bloom) ---
    const BLOOM_LAYER = 1;
    const bloomComposer = new EffectComposer(renderer);
    const finalComposer = new EffectComposer(renderer);

    bloomComposer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(sizes.width, sizes.height), 2.5, 0.5, 0.7);
    bloomComposer.addPass(bloomPass);
    bloomComposer.renderToScreen = false;

    const finalPass = new ShaderPass({
      uniforms: { baseTexture: { value: null }, bloomTexture: { value: null } },
      vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform sampler2D baseTexture; uniform sampler2D bloomTexture; varying vec2 vUv; void main() { gl_FragColor = texture2D(baseTexture, vUv) + texture2D(bloomTexture, vUv); }`
    }, 'baseTexture');
    
    finalComposer.addPass(new RenderPass(scene, camera));
    finalComposer.addPass(finalPass);

    // --- Generate Robot Face Texture for Target Positions ---
    const COMPUTE_SIZE = 128; // 16,384 particles
    let robotTexture;

    function generateRobotTargets() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      // Draw basic robot face pixel art
      ctx.fillStyle = 'black'; ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = 'white';
      ctx.fillRect(32, 32, 20, 20); // Left Eye
      ctx.fillRect(76, 32, 20, 20); // Right Eye
      ctx.fillRect(40, 80, 48, 16); // Mouth
      
      const imgData = ctx.getImageData(0, 0, 128, 128).data;
      const validCoords = [];
      for(let i = 0; i < 128 * 128; i++) {
        if(imgData[i * 4] > 100) validCoords.push({ x: i % 128, y: Math.floor(i / 128) });
      }

      const data = new Float32Array(COMPUTE_SIZE * COMPUTE_SIZE * 4);
      for(let i = 0; i < COMPUTE_SIZE * COMPUTE_SIZE; i++) {
        // Distribute particles evenly across the valid white pixels
        const coord = validCoords[i % validCoords.length];
        // Center and scale the robot face to fit the screen
        data[i*4]   = sizes.width / 2 + (coord.x - 64) * 5.0; 
        data[i*4+1] = sizes.height / 2 - (coord.y - 64) * 5.0; // Invert Y
        data[i*4+2] = (Math.random() - 0.5) * 10.0;
        data[i*4+3] = 1.0;
      }

      robotTexture = new THREE.DataTexture(data, COMPUTE_SIZE, COMPUTE_SIZE, THREE.RGBAFormat, THREE.FloatType);
      robotTexture.needsUpdate = true;
    }
    generateRobotTargets();

    // --- GPU Particles (FBO) ---
    let gpuCompute, positionVariable, velocityVariable, pointsMaterial;

    const noiseChunks = `
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+10.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
      float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 1.0/7.0;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy,h.x);
        vec3 p1 = vec3(a0.zw,h.y);
        vec3 p2 = vec3(a1.xy,h.z);
        vec3 p3 = vec3(a1.zw,h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }
      vec3 curlNoise(vec3 p) {
        const float e = 0.1;
        vec3 dx = vec3(e, 0.0, 0.0);
        vec3 dy = vec3(0.0, e, 0.0);
        vec3 dz = vec3(0.0, 0.0, e);
        vec3 p_x0 = vec3(snoise(p - dx), snoise(p - dx + vec3(12.3)), snoise(p - dx + vec3(24.6)));
        vec3 p_x1 = vec3(snoise(p + dx), snoise(p + dx + vec3(12.3)), snoise(p + dx + vec3(24.6)));
        vec3 p_y0 = vec3(snoise(p - dy), snoise(p - dy + vec3(12.3)), snoise(p - dy + vec3(24.6)));
        vec3 p_y1 = vec3(snoise(p + dy), snoise(p + dy + vec3(12.3)), snoise(p + dy + vec3(24.6)));
        vec3 p_z0 = vec3(snoise(p - dz), snoise(p - dz + vec3(12.3)), snoise(p - dz + vec3(24.6)));
        vec3 p_z1 = vec3(snoise(p + dz), snoise(p + dz + vec3(12.3)), snoise(p + dz + vec3(24.6)));
        float x = p_y1.z - p_y0.z - p_z1.y + p_z0.y;
        float y = p_z1.x - p_z0.x - p_x1.z + p_x0.z;
        float z = p_x1.y - p_x0.y - p_y1.x + p_y0.x;
        return normalize(vec3(x, y, z) / (2.0 * e));
      }
    `;

    function initGpuCompute() {
      gpuCompute = new GPUComputationRenderer(COMPUTE_SIZE, COMPUTE_SIZE, renderer);
      const posTex = gpuCompute.createTexture();
      const velTex = gpuCompute.createTexture();
      
      const posData = posTex.image.data;
      for(let i = 0; i < posData.length; i += 4) {
        posData[i] = Math.random() * sizes.width;
        posData[i+1] = Math.random() * sizes.height;
        posData[i+2] = 0; posData[i+3] = 1;
      }

      positionVariable = gpuCompute.addVariable('texturePosition', `
        void main() {
          vec2 uv = gl_FragCoord.xy / resolution.xy;
          vec4 pos = texture2D(texturePosition, uv);
          vec4 vel = texture2D(textureVelocity, uv);
          gl_FragColor = vec4(pos.xyz + vel.xyz, 1.0);
        }
      `, posTex);

      velocityVariable = gpuCompute.addVariable('textureVelocity', `
        ${noiseChunks}
        uniform vec3 uMouse;
        uniform vec2 uBounds;
        uniform float uTime;
        uniform float uAnger;
        uniform sampler2D uRobotTex;
        
        void main() {
          vec2 uv = gl_FragCoord.xy / resolution.xy;
          vec3 pos = texture2D(texturePosition, uv).xyz;
          vec3 vel = texture2D(textureVelocity, uv).xyz;
          
          vec2 center = uBounds * 0.5;
          
          // 1. CALM TARGET (Swirling Ring)
          float angle = uTime * 0.5 + (uv.x * 20.0);
          float radius = 150.0 + sin(uv.y * 10.0 + uTime) * 50.0;
          vec3 targetCalm = vec3(center.x + cos(angle)*radius, center.y + sin(angle)*radius, 0.0);
          
          // 2. ANGRY TARGET (Robot Face)
          vec3 targetRobot = texture2D(uRobotTex, uv).xyz;
          
          // BLEND TARGETS based on anger level
          vec3 targetPos = mix(targetCalm, targetRobot, uAnger);
          
          // Move towards target
          vec3 dirTarget = targetPos - pos;
          float pullStrength = mix(0.02, 0.08, uAnger); // Snaps tighter when angry
          vel += dirTarget * pullStrength;
          
          // 3. MOUSE INTERACTION (Disturbance)
          vec3 dirMouse = pos - uMouse;
          float distToMouse = length(dirMouse);
          
          if(distToMouse < 150.0) {
            float force = (150.0 - distToMouse) / 150.0;
            // Push particles away aggressively
            vel += normalize(dirMouse) * force * mix(5.0, 15.0, uAnger); 
          }
          
          // Add organic noise, reduce noise when angry so the robot shape is clearer
          vel += curlNoise(pos * 0.005 + uTime * 0.2) * mix(1.5, 0.5, uAnger);
          
          // Friction
          vel *= mix(0.92, 0.85, uAnger); // Higher friction when angry to lock into robot shape
          
          gl_FragColor = vec4(vel, 1.0);
        }
      `, velTex);

      gpuCompute.setVariableDependencies(positionVariable, [positionVariable, velocityVariable]);
      gpuCompute.setVariableDependencies(velocityVariable, [positionVariable, velocityVariable]);
      
      velocityVariable.material.uniforms.uBounds = { value: new THREE.Vector2(sizes.width, sizes.height) };
      velocityVariable.material.uniforms.uMouse = { value: fboMouse };
      velocityVariable.material.uniforms.uTime = { value: 0 };
      velocityVariable.material.uniforms.uAnger = { value: 0.0 };
      velocityVariable.material.uniforms.uRobotTex = { value: robotTexture };
      
      gpuCompute.init();
    }

    initGpuCompute();

    // --- Particle Material & Mesh ---
    const particlesGeom = new THREE.BufferGeometry();
    const refs = new Float32Array(COMPUTE_SIZE * COMPUTE_SIZE * 2);
    
    for(let i = 0; i < COMPUTE_SIZE * COMPUTE_SIZE; i++) {
      refs[i*2] = (i % COMPUTE_SIZE) / COMPUTE_SIZE;
      refs[i*2+1] = Math.floor(i / COMPUTE_SIZE) / COMPUTE_SIZE;
    }
    
    particlesGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COMPUTE_SIZE * COMPUTE_SIZE * 3), 3));
    particlesGeom.setAttribute('reference', new THREE.BufferAttribute(refs, 2));

    pointsMaterial = new THREE.ShaderMaterial({
      uniforms: { 
        uPositionTexture: { value: null }, 
        uAnger: { value: 0.0 }
      },
      vertexShader: `
        uniform sampler2D uPositionTexture; 
        attribute vec2 reference; 
        void main() { 
          vec3 pos = texture2D(uPositionTexture, reference).xyz; 
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0); 
          gl_PointSize = 3.0; 
        }`,
      fragmentShader: `
        uniform float uAnger;
        void main() { 
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          
          // Soft circular mask
          float mask = smoothstep(0.5, 0.2, d);
          
          // Color transition: Calm Green -> Angry Bright Red
          vec3 calmColor = vec3(0.1, 0.9, 0.4);
          vec3 angryColor = vec3(1.0, 0.1, 0.1);
          vec3 finalColor = mix(calmColor, angryColor, uAnger);
          
          gl_FragColor = vec4(finalColor, mask * 0.9); 
        }`,
      transparent: true, 
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particles = new THREE.Points(particlesGeom, pointsMaterial);
    particles.layers.set(BLOOM_LAYER); 
    scene.add(particles);

    // --- BOMB (Gold Sphere) Setup ---
    const bombGeo = new THREE.SphereGeometry(12, 32, 32);
    const bombMat = new THREE.MeshBasicMaterial({ color: 0xffd700 }); // Bright Gold
    const bomb = new THREE.Mesh(bombGeo, bombMat);
    bomb.visible = false;
    bomb.layers.set(BLOOM_LAYER); // Make it glow
    scene.add(bomb);
    let bombVelocityVector = new THREE.Vector3();

    function fireBomb() {
      if(state.bombActive) return;
      state.bombActive = true;
      bomb.visible = true;
      
      // Start from robot's mouth (center screen slightly down)
      bomb.position.set(sizes.width / 2, sizes.height / 2 - 40, 0);
      
      // Aim at where the cursor actively is
      const target = new THREE.Vector3(mouse.activeX, sizes.height - mouse.activeY, 0);
      bombVelocityVector.subVectors(target, bomb.position).normalize().multiplyScalar(15);
    }

    // --- Interaction & Event Listeners ---
    window.addEventListener('mousemove', (e) => {
      mouse.realX = e.clientX;
      mouse.realY = e.clientY;

      // Track disturbance (shaking mouse fast near the particles builds anger)
      if(!state.isAngry && state.stunTimer <= 0) {
        const distToCenter = Math.hypot(mouse.realX - sizes.width/2, mouse.realY - sizes.height/2);
        if(distToCenter < 300) {
          const movementDelta = Math.abs(e.movementX) + Math.abs(e.movementY);
          state.disturbance += movementDelta * 0.1;
        }
      }
    });

    window.addEventListener('resize', () => {
      sizes.width = window.innerWidth;
      sizes.height = window.innerHeight;
      
      camera.right = sizes.width;
      camera.top = sizes.height;
      camera.updateProjectionMatrix();
      
      renderer.setSize(sizes.width, sizes.height);
      bloomComposer.setSize(sizes.width, sizes.height);
      finalComposer.setSize(sizes.width, sizes.height);
      
      velocityVariable.material.uniforms.uBounds.value.set(sizes.width, sizes.height);
      generateRobotTargets(); // Re-center robot map
    });

    // --- Main Game/Render Loop ---
    const clock = new THREE.Clock();

    function raf() {
      requestAnimationFrame(raf);
      const time = clock.getElapsedTime();

      // --- 1. Story Logic Update ---
      
      // Handle Stun State
      if(state.stunTimer > 0) {
        state.stunTimer -= 16; // approx 60fps decrement
      } else {
        // Not stunned -> custom cursor follows real mouse
        mouse.activeX = mouse.realX;
        mouse.activeY = mouse.realY;
      }

      // Update Custom Cursor DOM visually
      cursorEl.style.transform = `translate(${mouse.activeX}px, ${mouse.activeY}px) translate(-50%, -50%)`;

      // Disturbance -> Anger Logic
      if (!state.isAngry) {
        if(state.disturbance > 0) state.disturbance -= 0.2; // Cool down over time
        
        if(state.disturbance > 150) {
          state.isAngry = true;
          document.body.classList.add('angry');
          // Fire the bomb 3 seconds after turning into a robot
          setTimeout(fireBomb, 3000);
        }
      }

      // Lerp Anger Level for smooth color/shape transitions
      if (state.isAngry) {
        state.angerLevel = Math.min(1.0, state.angerLevel + 0.015);
      } else {
        state.angerLevel = Math.max(0.0, state.angerLevel - 0.015);
      }

      // --- 2. Bomb Logic ---
      if (state.bombActive) {
        bomb.position.add(bombVelocityVector);

        // Check Collision with active cursor
        // Note: Ortho Camera Y goes from 0 at bottom to height at top
        const bombScreenY = sizes.height - bomb.position.y;
        const distToCursor = Math.hypot(bomb.position.x - mouse.activeX, bombScreenY - mouse.activeY);

        if (distToCursor < 25) { // Hit radius
          state.bombActive = false;
          bomb.visible = false;
          state.stunTimer = 5000; // Freeze for 5 seconds
          document.body.classList.add('stunned');
          
          // Reset game state after stun ends
          setTimeout(() => {
            document.body.classList.remove('stunned');
            document.body.classList.remove('angry');
            state.isAngry = false;
            state.disturbance = 0;
          }, 5000);
        }

        // Reset if bomb goes off screen
        if (bomb.position.x < -100 || bomb.position.x > sizes.width + 100 || 
            bomb.position.y < -100 || bomb.position.y > sizes.height + 100) {
          state.bombActive = false;
          bomb.visible = false;
          // Missed! Reset to calm
          document.body.classList.remove('angry');
          state.isAngry = false;
          state.disturbance = 0;
        }
      }

      // --- 3. FBO & GPU Compute Update ---
      // Pass active mouse coordinates to shaders (so particles ignore frozen mouse)
      fboMouse.x = mouse.activeX;
      fboMouse.y = sizes.height - mouse.activeY;
      
      velocityVariable.material.uniforms.uTime.value = time;
      velocityVariable.material.uniforms.uAnger.value = state.angerLevel;
      pointsMaterial.uniforms.uAnger.value = state.angerLevel;

      gpuCompute.compute();
      pointsMaterial.uniforms.uPositionTexture.value = gpuCompute.getCurrentRenderTarget(positionVariable).texture;

      // --- 4. Render Passes ---
      camera.layers.set(BLOOM_LAYER);
      bloomComposer.render();
      
      finalPass.uniforms.bloomTexture.value = bloomComposer.readBuffer.texture;
      camera.layers.set(0);
      finalComposer.render();
    }

    raf();
  </script>
</body>
</html>
